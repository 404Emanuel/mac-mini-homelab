- Overview:

    - Server Health:
        id: server-health-card
        icon: mdi-speedometer
        href: http://192.168.1.118:3000
        description: CPU · RAM · SSD · Temp
        widget:
          type: prometheusmetric
          url: http://192.168.1.118:9090
          refreshInterval: 5000
          metrics:
            - label: CPU
              query: 100 - (avg(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])) * 100)
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 1

            - label: RAM
              query: 100 * (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 1

            - label: SSD
              query: 100 * (1 - (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay"}))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 1

            - label: TEMP
              query: max(node_hwmon_temp_celsius{job="node-exporter"} < 110)
              format:
                type: number
                suffix: " °C"
                options:
                  maximumFractionDigits: 1

    - Network & Uptime:
        id: network-card
        icon: mdi-lan
        href: http://192.168.1.118:3000
        description: Ethernet · enp4s0
        widget:
          type: prometheusmetric
          url: http://192.168.1.118:9090
          refreshInterval: 5000
          metrics:
            - label: UPTIME
              query: time() - node_boot_time_seconds{job="node-exporter"}
              format:
                type: duration

            - label: RX
              query: sum(rate(node_network_receive_bytes_total{job="node-exporter",device="enp4s0"}[5m]))
              format:
                type: byterate

            - label: TX
              query: sum(rate(node_network_transmit_bytes_total{job="node-exporter",device="enp4s0"}[5m]))
              format:
                type: byterate

    - Host Load:
        id: host-load-card
        icon: mdi-memory
        href: http://192.168.1.118:9090
        description: Load · Disk · Rootfs
        widget:
          type: prometheusmetric
          url: http://192.168.1.118:9090
          refreshInterval: 5000
          metrics:
            - label: LOAD 1m
              query: node_load1{job="node-exporter"}
              format:
                type: number
                options:
                  maximumFractionDigits: 2

            - label: DISK
              query: 100 * (1 - (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay"}))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 1

            - label: ROOTFS
              query: node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay"}
              format:
                type: bytes



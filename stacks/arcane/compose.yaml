services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane

    ports:
      - "3552:3552"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - /home/emanuel/homelab/stacks:/home/emanuel/homelab/stacks

    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - PROJECTS_DIRECTORY=/home/emanuel/homelab/stacks
      - TZ=Europe/Zurich

    cgroup: host

    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

    restart: unless-stopped

volumes:
  arcane-data:
